server:
  address: ":8081"

fanout:
  # Required FANOUT_TOKEN is read only from the environment; no YAML/default secret.
  address: ":8082"
  advertise_addr: "connection:8082"

event:
  codec: "protobuf"

kafka:
  brokers:
    - "kafka:9092"
  inbound_topic: "user-request"

redis:
  addr: "redis:6379"
  password: ""
  db: 0
  room_users_prefix: "room:"
  room_users_suffix: ":users"
  user_gateway_prefix: "user:"
  user_gateway_suffix: ":gateway"
  room_users_ttl: "2m"
  user_gateway_ttl: "2m"
  presence_refresh_interval: "30s"

auth:
  backend_url: "http://app:8080"
